.sum-in { flex: 1; min-height: 0; overflow: auto; display: grid; align-content: start; gap: 18px; padding: 20px 22px 24px; }
.sum-k { color: var(--text-3); font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
.sum-when { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -8px; }
.sum-when b { display: block; font-weight: 600; font-size: 19px; line-height: 24px; }
.sum-when span { color: var(--text-2); }
.flaps.unset .flap { background: var(--raised); color: var(--text-3); }
.flaps.unset .flap::after { background: rgba(19, 32, 48, 0.06); }
.flaps.unset .colon { color: var(--text-3); }
.sum-route { display: grid; margin: 0; padding: 0; list-style: none; }
.sum-route li { position: relative; display: grid; padding: 0 0 12px 22px; min-width: 0; }
.sum-route li::before { content: ""; position: absolute; left: 0; top: 5px; width: 10px; height: 10px; border: 2px solid var(--text); border-radius: 50%; background: var(--panel); box-sizing: border-box; z-index: 1; }
.sum-route li.b::before { border-radius: 2px; background: var(--text); }
.sum-route li.s::before { width: 8px; height: 8px; left: 1px; top: 6px; border-color: var(--text-3); }
.sum-route li::after { content: ""; position: absolute; left: 4px; top: 15px; bottom: 0; width: 2px; background: var(--line-strong); }
.sum-route li:last-child { padding-bottom: 0; }
.sum-route li:last-child::after { display: none; }
.sum-route b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-route span { color: var(--text-3); font-size: 13px; line-height: 18px; }
.sum-route li.none span { color: var(--text-3); font-size: 14px; }
.sum-dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 6px 12px; margin: 0; padding-top: 16px; border-top: 1px solid var(--line); }
.sum-dl dt { color: var(--text-3); }
.sum-dl dd { display: grid; margin: 0; min-width: 0; }
.sum-dl dd span { color: var(--text-3); font-size: 13px; line-height: 18px; }
.sum-price { padding-top: 16px; border-top: 1px solid var(--line); }
.sum-price dt { font-size: 13px; }
.sum-price .tot { font-size: 18px; line-height: 24px; }
.sum-ret { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 12px 0 0; border-top: 1px solid var(--line); }
.sum-ret b { font-weight: 600; }
.sum-ret span { grid-column: 1; color: var(--text-3); font-size: 13px; }
.sum-ret .num { grid-column: 2; grid-row: 1; text-align: right; }
.sum-both { display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--line); font-weight: 600; font-size: 16px; }
.sum-miss { padding: 12px 14px; border-radius: 8px; background: var(--hover); }
.sum-miss b { font-weight: 600; }
.sum-miss ul { display: grid; gap: 4px; margin: 6px 0 0; padding: 0; list-style: none; }
.sum-miss li { display: flex; align-items: baseline; gap: 8px; }
.sum-miss li::before { content: ""; flex: none; width: 8px; height: 8px; border: 1.5px solid var(--text-3); border-radius: 50%; transform: translateY(-1px); }
.sum-miss button { color: var(--text-2); text-align: left; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
.sum-miss button:hover { color: var(--text); text-decoration-color: currentColor; }
.sum-ok { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 600; }
.sum-ok .ic { color: var(--ontime); }
.sum-f { display: grid; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
.sum-btns { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.sum-btns .btn { justify-content: center; height: 42px; font-size: 15px; }
.sum-f p { margin: 0; }
.sum-leave { color: var(--text-2); }
.sum-leave b { color: var(--text); font-weight: 600; }
/* ---------- Driver timeline ---------- */
/* Blue is ride progress, amber a tight turnaround, solid red an overlap, violet only the assistant's suggestion. */
.timeline { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
.tl-bar { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.tl-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--text-2); font-size: 13px; line-height: 18px; }
.tl-k { display: inline-flex; align-items: center; gap: 6px; }
.tl-sw { width: 16px; height: 10px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--panel); }
.tl-sw.st-ontheway { border-color: var(--ontime); }
.tl-sw.st-arrived { background: var(--ontime-tint); border-color: var(--ontime); }
.tl-sw.st-customerin { background: var(--ontime); border-color: var(--ontime); }
.tl-sw.st-done { background: var(--raised); border-color: var(--raised); }
.tl-sw.gap { height: 0; border: 0; border-top: 2px dotted var(--delayed); border-radius: 0; }
.tl-sw.over { background: var(--needs); border-color: var(--needs); }
.tl-sw.ghost { border: 1.5px dashed var(--selected-bar); background: var(--selected); }
.tl-hint { margin-left: auto; color: var(--text-3); font-size: 13px; line-height: 18px; }
.tl-scroll { flex: 1; min-height: 0; overflow: auto; }
.tl-grid { position: relative; }
.tl-head { position: sticky; top: 0; z-index: 4; display: flex; height: 44px; background: var(--panel); border-bottom: 1px solid var(--line-strong); }
.tl-corner { position: sticky; left: 0; z-index: 5; flex: none; width: 196px; display: flex; align-items: flex-end; padding: 0 14px 9px; background: var(--panel); border-right: 1px solid var(--line); color: var(--text-3); font-weight: 600; font-size: 11px; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
.tl-hours { position: relative; flex: none; }
.tl-hours span { position: absolute; bottom: 8px; padding-left: 5px; border-left: 1px solid var(--line-strong); color: var(--text-3); font: 600 13px/16px var(--f-num); white-space: nowrap; }
.tl-hours span.blk { color: var(--text); border-left-color: var(--text-3); }
.tl-hours span b { display: block; color: var(--text-2); font: 600 11px/14px var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; }
.tl-row { display: flex; border-bottom: 1px solid var(--line); }
.tl-name { position: sticky; left: 0; z-index: 3; flex: none; width: 196px; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 14px; background: var(--panel); border-right: 1px solid var(--line); }
.tl-name b { font-weight: 600; }
.tl-name span { color: var(--text-3); font-size: 12.5px; line-height: 17px; }
.tl-name .tl-st { color: var(--text-2); }
.tl-name .tl-st.busy { color: var(--inair); }
.tl-row.none, .tl-row.none .tl-name { background: var(--hover); }
.tl-row.none .tl-name { box-shadow: inset 3px 0 0 var(--text); }
.tl-row.aff .tl-name b { font-weight: 500; }
.tl-lane { position: relative; flex: none; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px var(--hour)); }
.tl-b { position: absolute; z-index: 1; height: 40px; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 19px 16px; align-content: center; column-gap: 7px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); text-align: left; overflow: hidden; cursor: grab; touch-action: none; user-select: none; transition: box-shadow 0.15s ease; }
.tl-b:hover { z-index: 2; box-shadow: 0 2px 8px rgba(19, 32, 48, 0.14); }
.tl-t { grid-row: 1 / 3; align-self: center; font-weight: 600; font-size: 15px; line-height: 20px; }
.tl-p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; line-height: 19px; }
.tl-r { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); font-size: 12px; line-height: 16px; }
.tl-b.tiny { grid-template-columns: 1fr; grid-template-rows: auto; padding: 0 4px; justify-items: center; }
.tl-b.tiny .tl-t { grid-row: auto; font-size: 12px; }
.tl-b.st-ontheway { border-color: var(--ontime); }
.tl-b.st-arrived { background: var(--ontime-tint); border-color: var(--ontime); }
.tl-b.st-customerin { background: var(--ontime); border-color: var(--ontime); color: #ffffff; }
.tl-b.st-customerin .tl-r { color: #cfe9d8; }
.tl-b.st-done, .tl-b.st-noshow, .tl-b.st-cancelled { background: var(--raised); border-color: transparent; color: var(--text-3); }
.tl-b.st-noshow .tl-p, .tl-b.st-cancelled .tl-p { text-decoration: line-through; }
.tl-b.dec { box-shadow: inset 3px 0 0 var(--selected-bar); }
.tl-b.sel { z-index: 2; border-color: var(--selected-bar); background: var(--selected); color: var(--text); box-shadow: inset 3px 0 0 var(--selected-bar), var(--ai-shadow); }
.tl-b.over { border: 1.5px solid var(--needs); }
.tl-ov { position: absolute; top: 3px; right: 4px; padding: 0 5px; border-radius: 3px; background: var(--needs); color: #fff; font: 600 10px/14px var(--f-ui); font-style: normal; letter-spacing: 0.04em; text-transform: uppercase; }
.tl-b.dim { opacity: 0.35; }
.tl-b.fixed { cursor: pointer; }
.tl-b.flash { animation: tlFlash 1.8s ease; }
@keyframes tlFlash { 0%, 50% { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--inair); } }
.tl-b.lift { z-index: 8; cursor: grabbing; box-shadow: var(--pop-shadow); transition: none; }
.tl-gap { position: absolute; z-index: 0; height: 40px; display: flex; align-items: flex-start; justify-content: center; color: var(--delayed); font: 600 11px/14px var(--f-num); }
.tl-gap::before { content: ""; position: absolute; left: 0; right: 0; top: 19px; border-top: 2px dotted var(--delayed); }
.tl-ghost { position: absolute; z-index: 1; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1.5px dashed var(--selected-bar); border-radius: 6px; background: var(--selected); color: var(--selected-bar); font-size: 12.5px; white-space: nowrap; overflow: hidden; pointer-events: auto; }
.tl-ghost b { color: var(--text); font-size: 14px; }
.tl-now { position: absolute; z-index: 4; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); pointer-events: none; }
.tl-now span { position: sticky; top: 0; display: inline-block; margin-left: -21px; padding: 1px 6px; border-radius: 0 0 4px 4px; background: var(--text); color: var(--flap-text); font-weight: 600; font-size: 13px; line-height: 18px; }
.tl-past { position: absolute; top: 44px; bottom: 0; z-index: 0; background: rgba(19, 32, 48, 0.035); pointer-events: none; }
.tl-row.drop-ok .tl-lane { background-color: var(--hover); box-shadow: inset 0 0 0 2px var(--text); }
.tl-row.drop-warn .tl-lane { background-color: var(--delayed-tint); box-shadow: inset 0 0 0 2px var(--delayed); }
.tl-row.drop-bad .tl-lane { background-color: var(--needs-tint); }
.tl-name .tl-drop-tip { margin-top: 2px; color: var(--text); font-weight: 600; }
.drop-warn .tl-name .tl-drop-tip { color: var(--delayed); }
.drop-bad .tl-name .tl-drop-tip { color: var(--needs); }

/* ---------- Live map ---------- */
/* Drawn the way Tesla's navigation draws it: flat gray land, darker water, few labels. The only strong colors are the
   cars (green, amber or red, as on the driver status chips), the routes (blue is a clear road, yellow slow, red heavy)
   and the pickups. Day and night follow the board clock until you pick one. */
.mapview { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); background: var(--panel); }
.mp-side { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.mp-sh { display: grid; gap: 6px; padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
.mp-sh h2 { font-weight: 600; font-size: 22px; line-height: 28px; }
.mp-sh p { color: var(--text-2); }
.mp-scroll { flex: 1; min-height: 0; overflow: auto; padding: 6px 10px 24px; }
.mp-scroll h5 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 14px 10px 6px; color: var(--text-3); font-weight: 600; font-size: 11px; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
.mp-scroll h5 b { color: var(--text-2); font-size: 13px; letter-spacing: 0; }
.mp-sum { width: 100%; color: var(--text-3); font-weight: 400; font-size: 12.5px; letter-spacing: 0; text-transform: none; }
.mp-seg { margin-left: auto; letter-spacing: 0; text-transform: none; }
.mp-seg button { height: 24px; padding: 0 9px; font-size: 12.5px; }
.mp-empty { margin: 4px 10px; color: var(--text-3); }
.mp-row { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; }
.mp-row:hover { background: var(--hover); }
.mp-row.on { background: var(--raised); box-shadow: inset 3px 0 0 var(--flap); }
.mp-row-t { flex: 1; display: grid; min-width: 0; }
.mp-row-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.mp-row-h .rs { flex: none; }
.mp-row-t b { font-weight: 600; }
.mp-row-t b .t3 { font-weight: 400; }
.mp-row-t > span { color: var(--text-2); font-size: 13px; line-height: 18px; }
.mp-row-t .lt { color: var(--delayed); font: 600 13px/18px var(--f-num); }
.mp-row-t .lt.bad { color: var(--needs); }
.mp-time { flex: none; width: 42px; font-size: 15px; line-height: 20px; }
.mp-dot { flex: none; display: inline-block; width: 12px; height: 12px; margin-top: 4px; border: 2px solid var(--text-3); border-radius: 50%; background: var(--panel); }
.mp-dot.st-ontheway { border-color: var(--ontime); }
.mp-dot.st-arrived { border-color: var(--ontime); background: var(--ontime-tint); }
.mp-dot.st-customerin { border-color: var(--ontime); background: var(--ontime); }
.mp-dot.late { border-color: var(--delayed); background: var(--delayed-tint); }
.mp-dot.latebad { border-color: var(--needs); background: var(--needs); }

.mp-map {
  --mp-bg: #e7e6e3; --mp-card: rgba(247, 247, 245, 0.93); --mp-solid: #f7f7f5; --mp-ink: #1d1d22; --mp-ink-2: #5c5c66; --mp-ink-3: #8a8a93;
  --mp-line: rgba(20, 20, 30, 0.08); --mp-hover: rgba(20, 20, 30, 0.05); --mp-route: #2563eb; --mp-slow: #e99a12; --mp-heavy: #d9291f;
  --mp-pin: #2b2a5a; --mp-halo: rgba(240, 240, 237, 0.96); --mp-ok: #16703f; --mp-ok-tint: #e3f1e7; --mp-late: #a86000; --mp-bad: #c4302b;
  --mp-shadow: 0 8px 24px rgba(20, 20, 30, 0.14), 0 1px 3px rgba(20, 20, 30, 0.10);
  position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--mp-bg); color: var(--mp-ink);
}
.mp-map.night {
  --mp-bg: #2b2a31; --mp-card: rgba(46, 45, 53, 0.93); --mp-solid: #2e2d35; --mp-ink: #f2f1f6; --mp-ink-2: #b6b5c0; --mp-ink-3: #8b8a95;
  --mp-line: rgba(255, 255, 255, 0.10); --mp-hover: rgba(255, 255, 255, 0.06); --mp-route: #3b76ff; --mp-slow: #f5ac2a; --mp-heavy: #ef3e32;
  --mp-pin: #f2f1f6; --mp-halo: rgba(24, 23, 29, 0.94); --mp-ok: #3fca7d; --mp-ok-tint: #1f4a32; --mp-late: #f3b44a; --mp-bad: #f0574d;
  --mp-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.35);
}
.mp-map > .mp-canvas { position: absolute; inset: 0; } /* beats MapLibre's own .maplibregl-map { position: relative } */
.mp-canvas .maplibregl-canvas { outline: none; }
.mp-loading { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; color: var(--mp-ink-2); font-size: 15px; pointer-events: none; }
.mp-map .maplibregl-ctrl-attrib { background: var(--mp-card); color: var(--mp-ink-3); font: 11px/16px var(--f-ui); }
.mp-map .maplibregl-ctrl-attrib a { color: inherit; }
.mp-map .maplibregl-ctrl-attrib-button { filter: var(--mp-attrib-filter, none); }
.mp-map.night { --mp-attrib-filter: invert(1); }

/* Floating cards, top left, like Tesla's trip card */
.mp-card { position: absolute; top: 14px; left: 14px; z-index: 3; width: 344px; max-width: calc(100% - 84px); max-height: calc(100% - 28px); display: flex; flex-direction: column; border-radius: 14px; background: var(--mp-card); color: var(--mp-ink); box-shadow: var(--mp-shadow); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.mp-card-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 10px 8px 16px; }
.mp-card-h > b { font-weight: 600; font-size: 18px; line-height: 22px; }
.mp-card-h .mp-sub { color: var(--mp-ink-2); }
.mp-card .rs { flex: none; }
.mp-x { flex: none; margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--mp-ink-2); }
.mp-x:hover { background: var(--mp-hover); color: var(--mp-ink); }
.mp-card-b { min-height: 0; overflow: auto; padding: 0 8px 8px; }
.mp-lead { margin: 0 8px 6px; color: var(--mp-ink-2); }
.mp-stops { margin: 0; padding: 0; list-style: none; }
.mp-stop { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; }
.mp-stop + .mp-stop::before { content: ''; position: absolute; left: 21px; top: -9px; height: 16px; border-left: 2px dotted var(--mp-ink-3); }
.mp-ico { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--mp-pin); color: var(--mp-solid); box-shadow: 0 0 0 2px var(--mp-solid); }
.mp-ico.do { background: var(--mp-solid); color: var(--mp-ink); box-shadow: inset 0 0 0 2px var(--mp-ink); }
.mp-ico.do::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--mp-ink); }
.mp-st { display: grid; min-width: 0; }
.mp-st .t { color: var(--mp-ink-2); font: 600 14px/18px var(--f-num); }
.mp-st b { overflow: hidden; font-weight: 600; font-size: 16px; line-height: 20px; text-overflow: ellipsis; white-space: nowrap; }
.mp-st .s { color: var(--mp-ink-2); font-size: 13px; line-height: 18px; }
.mp-stop.later { opacity: 0.6; }
.mp-go { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--mp-ink-2); }
.mp-go:hover { background: var(--mp-hover); color: var(--mp-ink); }
.mp-eta { margin: 6px 8px 4px; padding: 12px 14px 12px; border-radius: 11px; background: var(--mp-hover); box-shadow: inset 0 0 0 1px var(--mp-line); }
.mp-eta-row { display: flex; align-items: baseline; gap: 8px; }
.mp-eta-row .big { font: 600 24px/28px var(--f-num); }
.mp-eta-row .to { overflow: hidden; color: var(--mp-ink-2); text-overflow: ellipsis; white-space: nowrap; }
.mp-eta-row .r { margin-left: auto; flex: none; color: var(--mp-ink-2); font: 600 15px/20px var(--f-num); }
.mp-bar { position: relative; display: flex; height: 5px; margin: 12px 0 2px 16px; border-radius: 3px; background: var(--mp-line); }
.mp-bar::before { content: ''; position: absolute; left: -16px; top: -5px; border-style: solid; border-width: 7.5px 0 7.5px 12px; border-color: transparent transparent transparent var(--mp-ink); }
.mp-bar i { height: 100%; background: var(--mp-route); }
.mp-bar i:first-child { border-radius: 3px 0 0 3px; }
.mp-bar i:last-child { border-radius: 0 3px 3px 0; }
.mp-bar i.slow { background: var(--mp-slow); }
.mp-bar i.heavy { background: var(--mp-heavy); }
.mp-note { margin: 10px 0 0; color: var(--mp-ink-2); font-size: 13px; line-height: 18px; }
.mp-note b { color: var(--mp-ink); font-weight: 600; }
.mp-note.late b { color: var(--mp-late); }
.mp-note.bad b { color: var(--mp-bad); }
.mp-acts { flex: none; display: flex; gap: 6px; padding: 4px 16px 14px; }
.mp-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; background: var(--mp-hover); box-shadow: inset 0 0 0 1px var(--mp-line); color: var(--mp-ink); font-weight: 600; }
.mp-btn:hover { background: var(--mp-line); }
.mp-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.mp-list button { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; width: 100%; padding: 7px 8px; border-radius: 9px; color: inherit; text-align: left; }
.mp-list button:hover { background: var(--mp-hover); }
.mp-list span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-list .t3 { color: var(--mp-ink-2); font-size: 13px; }
.mp-jam { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; gap: 0 12px; width: 100%; padding: 6px 8px; border-radius: 10px; color: inherit; text-align: left; }
.mp-jam .who { color: var(--mp-ink); font-weight: 500; }
.mp-card.tr { width: 300px; max-height: min(420px, calc(100% - 28px)); }
.mp-jam:hover, .mp-jam.on { background: var(--mp-hover); }
.mp-jam > i { grid-row: span 3; border-radius: 3px; background: var(--mp-slow); }
.mp-jam.heavy > i { background: var(--mp-heavy); }
.mp-jam b { font-weight: 600; font-size: 15px; }
.mp-jam .d { align-self: start; font: 600 15px/20px var(--f-num); }
.mp-jam span { grid-column: 2 / -1; color: var(--mp-ink-2); font-size: 13px; line-height: 18px; }
.mp-clear { margin: 2px 8px 8px; color: var(--mp-ink-2); }

/* Map buttons, top right, as Tesla's square controls */
.mp-ctl { position: absolute; top: 14px; right: 14px; z-index: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.mp-ctl-g { display: flex; flex-direction: column; border-radius: 10px; background: var(--mp-card); box-shadow: var(--mp-shadow); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); overflow: hidden; }
.mp-ctl-g button { min-width: 40px; height: 40px; display: grid; place-items: center; color: var(--mp-ink); }
.mp-ctl-g button + button { border-top: 1px solid var(--mp-line); }
.mp-ctl-g button:hover { background: var(--mp-hover); }
.mp-ctl-g.txt button { display: flex; gap: 8px; padding: 0 12px; font-weight: 600; }
.mp-ctl-g button[aria-pressed="false"] { color: var(--mp-ink-3); }
.mp-tr-ico { width: 18px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--mp-route) 0 34%, var(--mp-slow) 34% 67%, var(--mp-heavy) 67%); }
[aria-pressed="false"] .mp-tr-ico { background: var(--mp-ink-3); opacity: 0.6; }
.mp-legend { position: absolute; left: 14px; bottom: 14px; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; max-width: calc(100% - 200px); padding: 7px 12px; border-radius: 10px; background: var(--mp-card); color: var(--mp-ink-2); font-size: 12.5px; line-height: 18px; box-shadow: var(--mp-shadow); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.mp-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mp-legend .ln { width: 16px; height: 4px; border-radius: 2px; background: var(--mp-route); }
.mp-legend .ln.slow { background: var(--mp-slow); }
.mp-legend .ln.heavy { background: var(--mp-heavy); }
.mp-legend .cd { width: 12px; height: 12px; border-radius: 50%; background: var(--mp-solid); box-shadow: inset 0 0 0 2px var(--mp-ok); }
.mp-legend .cd.late { box-shadow: inset 0 0 0 2px var(--mp-late); }
.mp-legend .cd.bad { background: var(--mp-bad); box-shadow: none; }
.mp-legend .sep { width: 1px; height: 14px; background: var(--mp-line); }

/* Cars: a disc with an arrow that points where the car is heading, and the driver's name */
.mp-car { --c: var(--mp-ink-3); --f: var(--mp-solid); --a: var(--c); display: flex; align-items: center; cursor: pointer; }
.mp-car-c { position: relative; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--f); box-shadow: inset 0 0 0 2.5px var(--c), 0 2px 6px rgba(0, 0, 0, 0.28); color: var(--a); transition: transform 0.15s ease; }
.mp-car-c svg { transition: transform 0.8s ease; }
.mp-car-c .pk { width: 8px; height: 8px; border-radius: 50%; background: var(--a); }
.mp-car-tag { position: absolute; left: 34px; top: 5px; display: inline-flex; gap: 4px; padding: 1px 7px; border-radius: 7px; background: var(--mp-solid); color: var(--mp-ink); font: 600 13px/18px var(--f-ui); white-space: nowrap; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22); }
.mp-car-tag .st { color: var(--mp-ink-2); font-weight: 500; }
.mp-car.on .mp-car-tag .st { color: inherit; opacity: 0.75; }
.mp-car-tag .lt { font: 600 13px/18px var(--f-num); color: var(--mp-late); }
.mp-car.latebad .mp-car-tag .lt { color: var(--mp-bad); }
.mp-car.st-ontheway, .mp-car.st-arrived, .mp-car.st-customerin { --c: var(--mp-ok); }
.mp-car.st-arrived { --f: var(--mp-ok-tint); }
.mp-car.st-customerin { --f: var(--mp-ok); --a: #ffffff; }
.mp-car.late { --c: var(--mp-late); --f: var(--mp-solid); --a: var(--mp-late); }
.mp-car.latebad { --c: var(--mp-bad); --f: var(--mp-bad); --a: #ffffff; }
.mp-car.on .mp-car-c { transform: scale(1.15); }
.mp-car.on .mp-car-tag { background: var(--mp-ink); color: var(--mp-solid); }
.mp-car.on .mp-car-tag .lt { color: inherit; }
.mp-car.wait .mp-car-c::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: mpWait 2.2s ease-out infinite; }
@keyframes mpWait { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.35); opacity: 0; } }

/* Pickups: a round pin with a tail, its icon inside and the label beside it */
.mp-pin { position: relative; width: 28px; height: 34px; cursor: pointer; }
.mp-pin-h { position: absolute; left: 0; top: 0; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--mp-pin); color: var(--mp-solid); box-shadow: 0 0 0 2px var(--mp-solid), 0 2px 6px rgba(0, 0, 0, 0.25); }
.mp-pin-h::after { content: ''; position: absolute; left: 9px; bottom: -8px; border-style: solid; border-width: 8px 5px 0; border-color: var(--mp-pin) transparent transparent; }
.mp-pin-n { position: absolute; right: -7px; top: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--mp-solid); color: var(--mp-ink); box-shadow: 0 0 0 1.5px var(--mp-pin); font: 600 12px/17px var(--f-num); text-align: center; }
.mp-pin-t { position: absolute; left: 34px; top: 4px; color: var(--mp-ink); font: 600 13.5px/18px var(--f-ui); white-space: nowrap; text-shadow: 0 0 2px var(--mp-halo), 0 0 2px var(--mp-halo), 0 0 3px var(--mp-halo), 0 0 4px var(--mp-halo); }
.mp-pin-t .num { color: var(--mp-ink-2); }
.mp-pin.on .mp-pin-h { transform: scale(1.12); }
.mp-dim .mp-car:not(.on), .mp-dim .mp-pin:not(.on) { opacity: 0.5; }
.mp-dim .mp-car:not(.on):hover, .mp-dim .mp-pin:not(.on):hover { opacity: 1; }

/* The time bubble on the open route, like Tesla's "23 min" callout */
.mp-bub { display: grid; padding: 5px 11px 6px; border-radius: 10px 10px 10px 3px; background: var(--mp-route); color: #ffffff; box-shadow: var(--mp-shadow); white-space: nowrap; pointer-events: none; }

.mp-bub.bad { background: var(--mp-bad); }
.mp-map.night .mp-bub.late { color: #2b1d00; }
.mp-inc { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--mp-heavy); color: #ffffff; box-shadow: 0 0 0 2px var(--mp-solid), 0 2px 6px rgba(0, 0, 0, 0.3); cursor: pointer; }
.mp-inc.slow { background: var(--mp-slow); }

@media (max-width: 1180px) {

  .mp-card { width: 300px; }
  .mp-legend { display: none; }

  const [fromId, toId] = d.arrows ? d.arrows[0] : [d.touch[0], null], cfOf = id => id ? `<span class="cf">${esc((d.codes && d.codes[id]) || codeOf(findRide(id)))}</span>` : '';

  const meta = `<p class="ai-meta">${esc(d.cost)} · ${esc(d.who[0] || '')}</p>`;
  const body = `${move}<p class="ai-story">${esc(d.story)}</p>${meta}`;
  const details = why ? `<div class="why"><ul>${d.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
    <div class="opts"><span class="opts-h">Ways to cover it, in-house first</span>${d.options.map((o, i) => `<div class="opt ${o.pick ? 'pick' : ''}"><span class="opt-n num">${i + 1}</span><span class="opt-t"><b>${esc(o.label)}</b> ${esc(o.text)}</span><span class="opt-c ${o.bad ? 'bad' : ''}">${esc(o.cost)}</span></div>`).join('')}</div>

  return `<div class="ai lead" data-aicard="${d.id}"><article class="ai-card x v2" aria-label="${esc(d.title)}">
    <div class="prob"><span class="t">${esc(d.title)}</span><span class="actby">act by</span><span class="tnum">${d.actBy}</span></div>

      <span class="spacer"></span><button class="btn ghost sm why-btn ${why ? 'open' : ''}" data-a="ai-why" data-v="${d.id}" aria-expanded="${why}">Details ${ic('right', 14)}</button></div>
  </article></div>`;
}
const aiCompact = d => `<div class="ai" data-aicard="${d.id}"><button class="ai-card c v2" data-a="ai-open" data-v="${d.id}">
    <span class="prob"><span class="t">${esc(d.title)}</span><span class="tnum">${d.actBy}</span></span>

function aiRailHTML() {
  const list = aiDecisions(), open = list.find(d => d.id === S.aiOpen) ? S.aiOpen : null;
  const cards = list.length ? `<div class="cards">${list.map(d => d.id === open ? aiCardHTML(d) : aiCompact(d)).join('')}</div>` : '<p class="muted">All clear. New problems show up here with a suggested fix.</p>';
  const gates = aiGate().map(({ code, f, hit, T }) => `<div class="gate-card"><div class="gate-h"><b class="num">${code}</b><span class="spacer"></span><span class="gate-d">+${f.late} min, at the gate</span></div>
    <p>${hit ? `If it leaves like that, ${esc(codesShort(hit.B))} (${cf(hit.R)}) would make ${esc(famCode(hit.first) || hit.first[0])} wait ${hit.sp.wait} min. Ready once it takes off: ${esc(T ? `${codesShort(hit.B)} ride with ${codesShort(T.t.fam)}, ${cf(T.t)} (${T.pax} of ${T.seats} seats)` : `${codesShort(hit.B)} get their own car`)}.` : 'Nothing breaks even if it leaves this late.'} Nothing changes until it takes off.</p></div>`).join('');
  const heads = aiHeads().map(r => `<div class="ai"><div class="ai-card h">${ic('spark', 16)}<p>${esc(`${r.driver} is about ${drvLate(r)} min late for ${rideSaid(r)} (${cf(r)}), after ${r.lateWhy}. ${promised(r) ? `That’s ${S.cfg.promise - drvLate(r)} min before our on-time promise makes the ride free, so keep an eye on it.` : `That’s inside the ${S.cfg.limit} min limit, so nothing to change.`}`)}</p></div></div>`).join('');
  // For someone opening the board for the first time, e.g. a recruiter: the story in three lines, then the first try.
  const start = list.length && store.get('sp-start') !== 'seen' ? `<section class="start" aria-label="Start here">
    <p><b>You’re the dispatcher.</b> It’s ${fmt(NOW)} on Thursday, Sep 4, 2025, a real day with 64 rides. Flights are landing late, and a shared van just broke.</p>

    <p>Codes like <b class="fc">3C</b> are families: group 3, family C.</p>
    <button class="btn sec sm" data-a="start-close">Got it</button></section>` : '';
  return `${start}<section class="sec"><div class="sec-t big"><b>Decisions</b><span class="cnt">${list.length}</span></div>${cards}</section>
    ${gates ? `<section class="sec"><div class="sec-t">${ic('clock', 15)}<b>Waiting for takeoff</b></div>${gates}</section>` : ''}
    ${heads ? `<section class="sec"><div class="sec-t">${ic('bulb', 15)}<b>Heads-up</b></div><div class="cards">${heads}</div></section>` : ''}
    ${handRailHTML(true)}`;
}

function parseDate(txt) {
  const s = txt.trim().toLowerCase().replace(/,/g, ' ').replace(/(\d)(st|nd|rd|th)\b/g, '$1').replace(/\s+/g, ' ');
  if (!s) return null;
  if (s === 'today') return TODAY;
  if (s === 'tomorrow') return addDays(TODAY, 1);
  const monthIdx = w => MONTH_FULL.findIndex(mn => w.length >= 3 && mn.toLowerCase().startsWith(w.replace('.', '')));
  const make = (mo, day, y) => {
    if (mo < 0 || mo > 11 || day < 1) return null;
    if (y == null) { y = TODAY.getFullYear(); if (new Date(y, mo, day) < TODAY) y += 1; }
    const d = new Date(y, mo, day);
    return d.getMonth() === mo ? d : null;
  };
  let m = s.match(/^(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?$/);
  if (m) { let y = m[3] ? +m[3] : null; if (y != null && y < 100) y += 2000; return make(+m[1] - 1, +m[2], y); }
  m = s.match(/^([a-z.]+) (\d{1,2})(?: (\d{4}))?$/);
  if (m) return make(monthIdx(m[1]), +m[2], m[3] ? +m[3] : null);
  m = s.match(/^(\d{1,2}) ([a-z.]+)(?: (\d{4}))?$/);
  if (m) return make(monthIdx(m[2]), +m[1], m[3] ? +m[3] : null);
  m = s.match(/^(?:next )?([a-z]+)$/);
  if (m) {
    const wd = DOW.findIndex(w => m[1].startsWith(w.toLowerCase()));
    if (wd >= 0) return addDays(TODAY, (wd - TODAY.getDay() + 7) % 7 || 7);
  }
  return null;
}
function selectDate(d) {
  if (daysBetween(d, TODAY) > 366) { S.cal.err = 'History goes back one year.'; return refreshMega(); }
  if (daysBetween(TODAY, d) > 366) { S.cal.err = 'Bookings open one year ahead.'; return refreshMega(); }
  S.day = sameDay(d, TODAY) ? 'live' : sameDay(d, addDays(TODAY, 1)) ? 'tomorrow' : 'date';
  S.date = d;
  S.filter = d < TODAY ? 'all' : 'upcoming'; S.menu = null; S.view = S.view === 'timeline' ? 'timeline' : 'grid';
  closeMega();
  renderAll();
  tablewrap.scrollTop = 0;
}
function goTyped() {
  const d = parseDate(S.cal.text);
  if (!d) { S.cal.err = 'Try a date like Nov 3, 11/3 or Friday.'; refreshMega(); $('pk-input')?.focus(); return; }
  selectDate(d);
}

// ---------- Search ----------
// One box for everyone on a ride: the passenger, the families riding along and whoever booked it, by name, phone
// or email, plus the conf #, flights, driver, vehicle and places. A phone matches however it's typed.
// Returns null for no match, { why: '' } when the row already shows the match, or the reason for one it doesn't:
// a label ("Booked by Michelle Reyes") and the details worth having on the call (who they are, phone, email).
const digitsOf = s => String(s ?? '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
// "206 555 01", "(206) 555-01" and "20655501" all find (206) 555-0142.
const telHit = (phone, q) => /^[\d\s()+.-]+$/.test(q.trim()) && digitsOf(q).length >= 3 && digitsOf(phone).includes(digitsOf(q));
function rideHit(r, raw) {
  const q = raw.trim().toLowerCase();
  if (!q) return { why: '' };
  const has = s => s != null && s !== '' && String(s).toLowerCase().includes(q);
  const tel = s => telHit(s, q);
  const p = PL[r.pu], o = PL[r.do], coded = r.fam && r.fam.every(famCode);
  // Lumora rows show family codes instead of names, so a name only counts as shown on other rows.
  if ([coded ? '' : r.party, r.flight, r.dflight, r.city, r.driver, r.vehicle, p.code, p.name, p.addr, o.code, o.name, o.addr].some(has)
    || (coded && r.fam.some(f => has(famCode(f))))
    || (S.colOn.conf && codeHit(r, q)) || (S.colOn.phone && tel(r.phone)) || (S.colOn.notes && has(r.notes))) return { why: '' };
  // A family riding along, by name or by its own flight.
  const fam = (r.fam || []).find(f => has(f[0]) || has(f[2]));
  if (fam) return { icon: 'users', why: `${coded ? famCode(fam) : 'Riding with'} ${fam[0]}`, more: [`${fam[1]} pax`, fam[2]], q };
  const other = otherBooker(r), by = { icon: 'user', why: `Booked by ${r.booker}`, more: [r.bookerRole, r.bookerPhone, r.bookerEmail], q };
  if (other && has(r.booker)) return by;
  if (other && tel(r.bookerPhone)) return Object.assign(by, { tel: r.bookerPhone });
  // "Lumora": the account, with its group when the notes carry one ("Lumora · Group 3").
  const acct = r.acct || r.account;
  if (has(acct)) return { icon: 'users', why: has(r.notes) ? r.notes : `${acct} account`, q };
  // The booker's email, or who they are ("daughter", "travel desk").
  if (other && (has(r.bookerEmail) || has(r.bookerRole))) return by;
  if (tel(r.phone)) return { icon: 'phone', why: 'Passenger phone', more: [r.phone], tel: r.phone };
  if (has(r.email)) return { icon: 'mail', why: 'Passenger email', more: [r.email], q };
  if (codeHit(r, q)) return { icon: 'tag', why: `Conf ${codeOf(r)}` };
  if (has(r.conf)) return { icon: 'tag', why: `Limo Anywhere record #${r.conf}`, q };
  if (has(r.notes)) return { icon: 'note', why: 'Trip notes', more: [r.notes], q };
  return null;
}

function markHit(text, q) {
  const i = q ? text.toLowerCase().indexOf(q) : -1;
  return i < 0 ? esc(text) : `${esc(text.slice(0, i))}<mark>${esc(text.slice(i, i + q.length))}</mark>${esc(text.slice(i + q.length))}`;
}

// ---------- Grid rows ----------
function visibleRides(o = {}) {
  const q = S.q.trim().toLowerCase();
  const ghosts = S.aiPv ? aiTouched() : [];
  const list = ridesFor(viewDate()).filter(r => {
    if (r.hidden && !ghosts.includes(r.id)) return false;
    if (!o.ignoreTod && S.tod !== 'all' && blockOf(r.pickup) !== S.tod) return false;
    if (S.driverF !== 'all' && (S.driverF === 'none' ? r.driver && r.driver !== '—' : r.driver !== S.driverF)) return false;
    if (S.puF !== 'all' && puKey(r) !== S.puF) return false;
    const f = o.anyStatus ? 'all' : S.filter;
    if (f === 'upcoming' && !isOpen(r) && !ghosts.includes(r.id)) return false;
    if (f === 'done' && (r.quote || !isClosed(r))) return false;
    if (f === 'quotes' && !r.quote) return false;
    if (S.vehicle !== 'all' && !r.vehicle.startsWith(S.vehicle)) return false;
    if (S.source === 'inhouse' && (r.aff || r.quote)) return false;
    if (S.source === 'affiliate' && !r.aff) return false;
    if (q && !rideHit(r, q)) return false;
    return true;
  });
  // Shared vans stay together, anchored at the group's earliest pickup.
  const grp = {};
  for (const r of list) if (r.g) { const g = grp[r.g] || (grp[r.g] = { t: Infinity, s: Infinity }); g.t = Math.min(g.t, r.pickup); g.s = Math.min(g.s, r.seq); }
  const key = r => r.g ? [grp[r.g].t, grp[r.g].s, r.gi] : [r.pickup, r.seq, 0];
  return list.sort((a, b) => { const ka = key(a), kb = key(b); return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2]; });
}

function famState(f, r) {

function emptyHTML() {

function renderRows() {
  if (S.view === 'timeline') { renderTimeline(); return; } // every change that redraws the grid redraws the timeline instead
  const list = visibleRides(), live = isLive();
  // With the Email tab up, the rides of the open email are the ones marked, on whatever day they fall.

function mailWinHTML(m) {
  const st = mailState(m.id), open = st === 'open', blocked = open && isBlocked(m), sent = S.mail[m.id];
  const msg = `<section class="ed-card">${fromHTML(m, `${m.addr} → ${MAIL_BOX}`)}

  let side, foot;
  if (m.filed) {
    side = `<section class="ed-card"><div class="ailabel">${ic('spark', 14)}<span>Filed by the assistant</span></div><p>${esc(m.why)}</p><p class="muted sm">Gmail label: ${esc(m.label)}</p></section>`;
    foot = '<span class="spacer"></span><button class="btn sec" data-a="ed-close">Close</button>';
  } else {

      : `<div class="ailabel">${ic('spark', 14)}<span>${open ? 'Prepared by the assistant' : st === 'waiting' ? 'Approved · waiting' : 'Done'}</span></div>`;
    const prep = `<section class="ed-card">${label}<div class="fix">${ic(m.icon, 16)}<span>${esc(m.fix())}</span></div>
      ${mailResHTML(m)}${open ? mailChangesHTML(m) + mailChecksHTML(m) : `<p class="t3">${esc(val(st === 'waiting' ? m.waitMeta : m.doneMeta))}</p>`}</section>`;
    const subj = /^Re:/.test(m.subject) ? m.subject : `Re: ${m.subject}`;
    const reply = `<section class="ed-card"><h3>${open ? 'Reply' : st === 'waiting' && m.sendWhenDone ? 'Reply · goes out with the invoice' : 'Reply sent'}</h3>
      <div class="mhead"><span>To</span><b>${esc(m.from)} &lt;${esc(m.addr)}&gt;</b><span>Subject</span><b>${esc(subj)}</b></div>
      ${open ? `<textarea class="inp ta mta" data-mdraft="${m.id}" aria-label="Reply to ${esc(m.from)}">${esc(S.mailDraft[m.id] ?? m.reply())}</textarea>` : `<div class="mbody sent">${esc(sent.text)}</div>`}
      ${attHTML(m.attach)}</section>`;
    side = prep + reply;
    foot = open
      ? `<span class="muted sm">${blocked ? `Approve “${esc(CARD[m.decision].title)}” first. The reply follows it.` : 'Approving sends this reply and makes the change on the board.'}</span>
        <button class="btn sec" data-a="ed-close">Cancel</button>

      : `<span class="spacer"></span>${st === 'waiting' && m.sendWhenDone ? `<button class="btn sec" data-a="mail-send-now" data-v="${m.id}">Send now</button>` : ''}<button class="btn ${st === 'waiting' && m.sendWhenDone ? 'ghost' : 'sec'}" data-a="ed-close">Close</button>`;
  }
  return `<header class="ed-h">
      <div class="ed-t"><span class="ed-k">Email · Gmail</span><h2 id="edTitle">${esc(m.subject)}</h2><span class="ed-sub">${esc(m.from)} · Today ${m.at}</span></div>

      <button class="iconbtn" data-a="ed-close" aria-label="Close">${ic('x', 18)}</button>
    </header>
    <div class="ed-body mail"><div class="ed-col">${msg}</div><div class="ed-col">${side}</div></div>
    <footer class="ed-f">${foot}</footer>`;
}

  if (!r.flight || PL[r.pu].code == null) return `Pickup at ${PL[r.pu].name === 'Home' ? 'the passenger’s home' : PL[r.pu].name} at ${fmt(r.pickup)}.`;
  const f = FLIGHTS[r.flight];

  if (r.fam && r.fam.length > 1) return `${r.lastFam}’s family is the last to reach the curb: they land at ${fmt(r.landT)}, and ${r.readyWhy.charAt(0).toLowerCase() + r.readyWhy.slice(1)}. The van picks everyone up ${r.readyMin} min after that landing, at ${fmt(r.pickup)}.`;

  const rank = f => !f ? 0 : f.small ? 3 : f.late ? 2 : 1;
  fits.sort((a, b) => rank(a[1]) - rank(b[1]) || a[0].localeCompare(b[0]));
  return [['', 'No driver yet'], ...fits.map(([d, f]) => [d, f ? `${d} · ${f.label}` : d]), ...Object.keys(AFF_NAMES).map(k => [k, `${k} (affiliate)`])];

// The booked vehicle sets the price; the car that goes can be the same size or bigger, never smaller.
// Smaller fails even when the people fit, because the bags won't: that's why people book the bigger car.
// Booking classes from plainest to grandest. The Cadillac class is the Escalade; Van 15 and the Sprinter are one van.

// ---- When: the pickup time works itself out from the flight where it can ----

// Who's free around the pickup: anyone with a ride within 90 minutes is busy.
function driverAvail(d) {
  const t = nrPickup(d), list = ridesFor(d.date), type = vtypeOf(d.vehicle).key;
  const pool = POOL_CARS.find(c => vtypeOf(c).key === type);
  return Object.keys(DRIVERS).map(name => {
    const own = DRIVERS[name], fit = carFit(own, { vehicle: d.vehicle, pax: d.pax }), ownFits = fit !== 'small', fits = ownFits || !!pool;
    const jobs = list.filter(r => r.driver === name && !r.quote && !r.hidden && r.ride !== 'cancelled' && r.ride !== 'noshow');
    const busy = t == null ? null : jobs.find(r => Math.abs(r.pickup - t) < 90);
    const where = r => PL[r.pu].code ? (r.flight || PL[r.pu].code) : PL[r.pu].name;
    const text = t == null ? `${jobs.length} ${jobs.length === 1 ? 'ride' : 'rides'} that day` : busy ? `Busy · ${fmt(busy.pickup)} ${where(busy)}` : `Free at ${fmt(t)}`;
    const car = ownFits ? `${carLabel(own)}${fit === 'upgrade' ? ' · free upgrade' : ''}` : pool ? `${pool} · shared` : `Drives a ${carWord(own)}, too small`;
    return { name, car, fits, busy: !!busy, text };

const cardBrand = n => /^4/.test(n) ? 'Visa' : /^(5[1-5]|2[2-7])/.test(n) ? 'Mastercard' : /^3[47]/.test(n) ? 'Amex' : /^6/.test(n) ? 'Discover' : '';

      <div class="sum-when"><div><b>${dayLabel(d.date)}</b><span>${esc(d.service)}${isHourly(d.service) ? ` · ${hoursOf(nrRideLike())} h` : ''}</span></div>${clock}</div>

        <dt>People</dt><dd>${people}</dd>
        <dt>Vehicle</dt><dd>${esc(vtypeOf(d.vehicle).name)}</dd>
        <dt>Driver</dt><dd>${esc(drv)}</dd>
        <dt>Payment</dt><dd>${esc(payText(d))}</dd>

      ${ret}
      ${miss.length ? `<div class="sum-miss"><b>Before you book</b><ul>${miss.map(m => `<li><button data-a="nr-goto" data-v="${m.f}">${esc(m.text)}</button></li>`).join('')}</ul></div>` : `<p class="sum-ok">${ic('checkc', 16)}Ready to book</p>`}

function parseRequest(text) {

  if (phone) set.phone = fmtPhone(phone[0]);

  if (!booker) {
    const lines = text.split(/\n/).map(x => x.trim()).filter(Boolean).slice(-4);

  const rel = /\bmy (parents|mom|mother|dad|father|wife|husband|boss|client|guests?|daughter|son|grandparents|in-laws)\b/i.exec(t);
  if (pass && pass !== booker) { const [f, ...rest] = pass.split(' '); Object.assign(set, { other: true, pFirst: f, pLast: rest.join(' ') }); }
  else if (rel) {
    set.other = true;
    if (/parents|grandparents|in-laws|mom|mother|dad|father/i.test(rel[1]) && set.last && !/in-laws/i.test(rel[1])) { set.pLast = set.last; guessed.pLast = true; }
  }

  const hits = [];

// Limo Anywhere spreads this over Settle (Payments Needed, Ready to Settle, Settled) and Receivables.

const CARD_BRANDS = ['Visa', 'Mastercard', 'Amex', 'Visa'];
function coMethod(r) {
  if (r.aff) return { k: 'farm', label: `Farm-out · ${AFF_NAMES[r.driver] || r.driver}`, short: AFF_NAMES[r.driver] || r.driver };

// How long the driver waited past the pickup time, staged from the ride so it's the same every time.
// A chauffeur who got there late only starts waiting once he's there.
const coWaited = r => S.co.wait[r.id] ?? Math.max(0, (PL[r.pu].code ? (r.seq * 13) % 44 : (r.seq * 7) % 26) - coLate(r));

      <path d="M${x},${H - padB} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + bw - 4} Q${x + bw},${y} ${x + bw},${y + 4} V${H - padB} Z" class="vz-bar ${v === peak[1] ? 'peak' : ''}"/>

// What the driver holds: today's jobs, the ride in progress with one big next step, and job offers to accept.

// this keeps it that simple, but adds the flight, the sign, and the wait clock.
S.da = { driver: 'Tony', ride: null, offer: null, offerAt: 0 };
const NEXT_STEP = { assigned: ['ontheway', 'I’m on my way'], ontheway: ['arrived', 'I’ve arrived'], arrived: ['customerin', 'Customer is in the car'], customerin: ['done', 'Drop off and finish'] };

const daCurrent = d => daJobs(d).find(r => ['ontheway', 'arrived', 'customerin'].includes(r.ride)) || daJobs(d).find(r => r.ride === 'assigned');
function daStep(r) {

  const prev = r.ride;
  r.ride = nx[0];
  flash([r.id]);
  logChange(`${r.driver} marked ${r.party} as ${rsName(nx[0])} in the driver app`);
  // The same automatic texts the board sends, so the passenger thread stays true.
  const auto = nx[0] === 'ontheway' && S.msgOn.otw ? ['otw', 'Driver on the way'] : nx[0] === 'arrived' && S.msgOn.arrived ? ['arrived', 'Driver arrived'] : null;

}

// ---------- Actions ----------
function flash(ids) {

function approve(id) {
  const c = CARD[id];
  const drivers = (S.adjust[id] || c.plan.map(p => p.driver)).slice();
  const snap = c.touches.map(rid => { const r = findRide(rid); return Object.assign({}, r, { wait: r.wait && Object.assign({}, r.wait) }); });
  c.apply(drivers);
  S.resolved[id] = { drivers, snap, at: fmt(NOW) };
  S.order.push(id);
  delete S.adjust[id]; delete S.why[id];
  if (S.openCard === id) S.openCard = (unresolved()[0] || {}).id || null;
  flash(c.touches);
  logChange(`Approved: ${c.doneTitle(drivers)}`);
  renderAll();
  const lm = MAILS.find(m => m.decision === id && mailState(m.id) === 'open');
  toast(c.toast(drivers) + (lm ? ` The reply to the ${lm.org || lm.from} is ready under Email.` : ''), () => undoFix(id));
}
function undoFix(id) {
  const res = S.resolved[id];
  if (!res) return;
  res.snap.forEach(s => Object.assign(findRide(s.id), s));
  delete S.resolved[id];
  S.order = S.order.filter(x => x !== id);
  S.openCard = id;
  flash(CARD[id].touches);
  logChange(`Undid: ${CARD[id].doneTitle(res.drivers)}`);
  S.toast = null;
  renderAll();
}

// Email: approving sends the reply and makes the change. Some requests then wait on someone (a customer's
// card, a reply, a ride that isn't done yet) and finish on their own. Undo works like Gmail's undo send.
const mailTimers = {};
function approveMail(id) {
  const m = MAIL[id];
  if (mailState(id) !== 'open' || isBlocked(m)) return;
  const text = S.mailDraft[id] ?? m.reply();
  const snap = mailRides(m).map(r => Object.assign({}, r));
  if (m.apply) m.apply();
  const waiting = !!(m.wait && m.wait());
  S.mail[id] = { state: waiting ? 'waiting' : 'done', at: fmt(NOW), text, snap, n: ++S.mailSeq };
  delete S.mailDraft[id]; delete S.mailWhy[id];
  if (S.openMail === id) S.openMail = null;
  flash(mailRides(m).map(r => r.id));
  logChange(`Approved email from ${m.from}: ${m.fix()}`);
  renderAll();
  toast(m.toast(), () => undoMail(id));
  if (waiting && m.later && m.later.ms) mailTimers[id] = setTimeout(() => finishMail(id), m.later.ms);
}
// Returns the toast text, so a caller with its own toast can say both things.
function finishMail(id, quiet) {
  const m = MAIL[id], st = S.mail[id];
  if (!st || st.state !== 'waiting') return '';
  clearTimeout(mailTimers[id]);
  if (m.later && m.later.apply) m.later.apply();
  Object.assign(st, { state: 'done', doneAt: fmt(NOW), n: ++S.mailSeq });
  logChange(m.later ? m.later.log : `Closed the email from ${m.from}`);
  renderAll();
  const text = m.later ? m.later.toast() : '';
  if (!quiet && text) toast(text);
  return text;
}
function undoMail(id) {
  const m = MAIL[id], st = S.mail[id];
  if (!st) return;
  clearTimeout(mailTimers[id]);
  const list = ridesFor(m.day || TODAY);
  st.snap.forEach(s => { const r = list.find(x => x.id === s.id); if (r) restoreRide(r, s); });
  if (m.unapply) m.unapply();
  delete S.mail[id];
  S.mailDraft[id] = st.text;
  S.openMail = id; S.railTab = 'email';
  flash(st.snap.map(s => s.id));
  logChange(`Undid the reply to ${m.from}`);
  S.toast = null;
  renderAll();
}
function mailRideDone(rideId) {
  return MAILS.filter(m => m.sendWhenDone === rideId && mailState(m.id) === 'waiting').map(m => finishMail(m.id, true)).join(' ');

document.addEventListener('click', e => {

  if (!el || !dragCol) return;
  e.preventDefault();
  const to = el.dataset.col, o = S.colOrder;
  if (to !== dragCol) { o.splice(o.indexOf(dragCol), 1); o.splice(o.indexOf(to) + (dropSide(el, e) === 'after' ? 1 : 0), 0, dragCol); }
  dragCol = null; clearDrop(); afterCfg();
});
document.addEventListener('dragend', () => { dragCol = null; clearDrop(); });
tablewrap.addEventListener('scroll', () => { if (S.menu || S.ctxMenu) { S.menu = null; S.ctxMenu = null; renderOverlay(); } }, { passive: true });
// Right-click a ride (or press the menu key on it) for everything you can do with the reservation.
rowsEl.addEventListener('contextmenu', e => {
  const row = e.target.closest('.row[data-v]');
  if (!row) return;
  e.preventDefault();
  const b = row.getBoundingClientRect();
  S.menu = null;
  S.ctxMenu = { id: row.dataset.v, x: e.clientX || b.left + 160, y: e.clientY || b.bottom };
  renderOverlay();
});
addEventListener('resize', () => {
  if (S.menu) { S.menu = null; renderOverlay(); }
  syncHdrH();
  if (S.mega) sizeMega();
  pillPlaced = false; placePill(pillRest());
});
// New reservation: suggestion lists open on focus, stay open while you click in them, and close when you leave the field.
document.addEventListener('focusin', e => { if (S.nr && e.target.dataset?.tyIn) tyOpen(e.target); });
document.addEventListener('focusout', e => { if (S.nr && e.target.dataset?.tyIn) setTimeout(() => { if (TY && TY.el === e.target && document.activeElement !== e.target) tyClose(); }, 120); });
document.addEventListener('mousedown', e => { if (e.target.closest?.('.ty-i')) e.preventDefault(); });

if (HAND) handInit(); else buildCodes();
if (aiOn()) S.aiOpen = (aiDecisions()[0] || {}).id || null;
buildHeader();
renderThead();
renderAll();
document.fonts?.ready.then(() => { pillPlaced = false; placePill(pillRest()); syncHdrH(); });
</script>
